<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Usage Monitor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .dashboard {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .overview {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .overview h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-detail {
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .alert {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .alert-warning {
            background: rgba(255,193,7,0.2);
            border-left: 4px solid #ffc107;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .services {
            display: grid;
            gap: 15px;
        }
        
        .service-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .service-name {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .service-cost {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        
        .service-percentage {
            font-size: 0.9em;
            color: #666;
            margin-left: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .progress-fill.warning {
            background: linear-gradient(90deg, #ff9800 0%, #ff5722 100%);
        }
        
        .progress-fill.danger {
            background: linear-gradient(90deg, #f44336 0%, #d32f2f 100%);
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .last-updated {
            text-align: right;
            color: #666;
            font-size: 0.85em;
            margin-top: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102,126,234,0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 AI Usage Monitor Dashboard</h1>
            <p>Comprehensive cost tracking and budget management</p>
        </div>
        
        <div class="dashboard">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px;">Loading dashboard data...</p>
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
            
            <div id="content" style="display: none;">
                <div class="overview">
                    <h2>📊 Monthly Overview</h2>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-label">💰 Total Monthly Cost</div>
                            <div class="stat-value" id="monthly-cost">$0.00</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">📊 Budget Usage</div>
                            <div class="stat-value" id="budget-used">0%</div>
                            <div class="stat-detail" id="budget-detail">$0.00 / $0.00</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">⚠️ Projected Cost</div>
                            <div class="stat-value" id="projected-cost">$0.00</div>
                            <div class="stat-detail" id="projection-status">On track</div>
                        </div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" id="budget-progress" style="width: 0%;">
                            <span id="budget-progress-text"></span>
                        </div>
                    </div>
                    
                    <div id="alert-container"></div>
                </div>
                
                <div class="section">
                    <h3>🔧 Service Breakdown</h3>
                    <div class="services" id="services-list">
                        <!-- Services will be inserted here -->
                    </div>
                </div>
                
                <div class="buttons">
                    <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh</button>
                    <button class="btn btn-secondary" onclick="window.location.href='/api/dashboard'">📥 View Raw Data</button>
                </div>
                
                <div class="last-updated">
                    Last updated: <span id="last-updated">Never</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let dashboardData = null;
        
        function formatCurrency(amount) {
            return '$' + amount.toFixed(2);
        }
        
        function formatPercentage(value) {
            return value.toFixed(1) + '%';
        }
        
        function formatDateTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString();
        }
        
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/dashboard');
                if (!response.ok) {
                    throw new Error('Failed to fetch dashboard data');
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
                throw error;
            }
        }
        
        function updateDashboard(data) {
            dashboardData = data;
            
            // Update monthly cost
            document.getElementById('monthly-cost').textContent = formatCurrency(data.monthly_cost);
            
            // Update budget usage
            document.getElementById('budget-used').textContent = formatPercentage(data.budget_used);
            document.getElementById('budget-detail').textContent = 
                `${formatCurrency(data.monthly_cost)} / ${formatCurrency(data.budget)}`;
            
            // Update projected cost
            document.getElementById('projected-cost').textContent = formatCurrency(data.projected_cost);
            document.getElementById('projection-status').textContent = 
                data.over_budget ? '⚠️ Over budget!' : '✓ On track';
            
            // Update progress bar
            const budgetProgress = document.getElementById('budget-progress');
            const budgetUsedPercent = Math.min(data.budget_used, 100);
            budgetProgress.style.width = budgetUsedPercent + '%';
            
            // Update progress text in the span element
            const progressTextSpan = budgetProgress.querySelector('span');
            if (progressTextSpan) {
                progressTextSpan.textContent = formatPercentage(budgetUsedPercent);
            }
            
            // Update progress bar color
            budgetProgress.className = 'progress-fill';
            if (data.budget_used >= 100) {
                budgetProgress.classList.add('danger');
            } else if (data.budget_used >= 80) {
                budgetProgress.classList.add('warning');
            }
            
            // Show alert if over budget
            const alertContainer = document.getElementById('alert-container');
            if (data.over_budget) {
                alertContainer.innerHTML = `
                    <div class="alert alert-warning">
                        ⚠️ Warning: Projected monthly cost (${formatCurrency(data.projected_cost)}) 
                        exceeds budget (${formatCurrency(data.budget)})!
                    </div>
                `;
            } else {
                alertContainer.innerHTML = '';
            }
            
            // Update service breakdown
            const servicesList = document.getElementById('services-list');
            servicesList.innerHTML = '';
            
            if (data.service_breakdown && data.service_breakdown.length > 0) {
                data.service_breakdown.forEach(service => {
                    const percentage = data.monthly_cost > 0 
                        ? (service.total_cost / data.monthly_cost * 100) 
                        : 0;
                    
                    const serviceDiv = document.createElement('div');
                    serviceDiv.className = 'service-item';
                    serviceDiv.innerHTML = `
                        <div>
                            <div class="service-name">${service.service}</div>
                            <div style="font-size: 0.85em; color: #666; margin-top: 5px;">
                                ${service.total_tokens.toLocaleString()} tokens
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <span class="service-cost">${formatCurrency(service.total_cost)}</span>
                            <span class="service-percentage">(${formatPercentage(percentage)})</span>
                        </div>
                    `;
                    servicesList.appendChild(serviceDiv);
                });
            } else {
                servicesList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No usage data available</p>';
            }
            
            // Update last updated timestamp
            document.getElementById('last-updated').textContent = formatDateTime(data.last_updated);
        }
        
        async function refreshData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            
            try {
                const data = await fetchDashboardData();
                updateDashboard(data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 
                    'Error loading dashboard data: ' + error.message;
            }
        }
        
        // Load data on page load
        refreshData();
        
        // Auto-refresh every 5 minutes
        setInterval(refreshData, 5 * 60 * 1000);
    </script>
</body>
</html>
